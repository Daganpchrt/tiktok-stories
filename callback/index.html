<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #1B1D22;
    --ink-muted: #5B6472;
    --ink-faint: #8B93A1;
    --border: #E2E4E9;
    --accent: #3454D1;
    --accent-ink: #FFFFFF;
    --code-bg: #F0F1F4;
    --ok-bg: #E7F5EC;
    --ok-ink: #1D7A46;
    --err-bg: #FBEAEA;
    --err-ink: #B23A3A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161B;
      --surface: #1B1E25;
      --ink: #E8E9ED;
      --ink-muted: #9AA1AE;
      --ink-faint: #6B7280;
      --border: #2A2D35;
      --accent: #6C8BFF;
      --accent-ink: #0E1116;
      --code-bg: #23262E;
      --ok-bg: #12271B;
      --ok-ink: #6FDBA0;
      --err-bg: #2A1717;
      --err-ink: #F0A0A0;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0;
  }
  p { margin: 0; color: var(--ink-muted); line-height: 1.55; }
  .field-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .code-box {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    word-break: break-all;
    user-select: all;
  }
  button {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status {
    font-size: 13.5px;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .status.err { background: var(--err-bg); color: var(--err-ink); }
</style>
</head>
<body>
  <div class="card">
    <div>
      <span class="eyebrow">Daily Story · TikTok authorization</span>
      <h1 id="heading">Reading response…</h1>
    </div>
    <p id="message">Parsing the redirect from TikTok.</p>

    <div id="codeSection" style="display:none; display:flex; flex-direction:column; gap:8px;">
      <span class="field-label">Authorization code</span>
      <div class="code-box" id="codeBox"></div>
      <button id="copyBtn" type="button">Copy code</button>
      <div class="status" id="copyStatus"></div>
    </div>

    <p id="instructions" style="display:none;">Copy the code above, then paste it back into
      the terminal running <code>tiktok_login.py</code>, which is waiting for it.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");
    const codeSection = document.getElementById("codeSection");
    const codeBox = document.getElementById("codeBox");
    const instructions = document.getElementById("instructions");
    const copyBtn = document.getElementById("copyBtn");
    const copyStatus = document.getElementById("copyStatus");

    if (code) {
      heading.textContent = "Authorization complete";
      message.textContent = "TikTok redirected back successfully.";
      codeBox.textContent = code;
      codeSection.style.display = "flex";
      instructions.style.display = "block";

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          copyStatus.textContent = "Copied to clipboard.";
          copyStatus.className = "status ok";
          copyStatus.style.display = "block";
        } catch (e) {
          copyStatus.textContent = "Couldn't copy automatically — select the text above and copy it manually.";
          copyStatus.className = "status err";
          copyStatus.style.display = "block";
        }
      });
    } else {
      heading.textContent = "Authorization failed";
      message.textContent = error
        ? "TikTok returned an error: " + error
        : "No authorization code was found in the URL.";
    }
  </script>
</body>
</html>
